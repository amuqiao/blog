<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Owl ASCII</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
            :root {
                --accent: #e8a13c;
                --font: 9px;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                background: #000;
                color: #f3e7d3;
                font-family: 'JetBrains Mono', monospace;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: stretch;
                min-height: 100vh;
                overflow: hidden;
            }
            /* Khung con cu - khong con title bar */
            .window {
                position: relative;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
                border: 1px solid rgba(232, 161, 60, 0.28);
                border-radius: 14px;
                box-shadow: inset 0 0 60px -10px rgba(232, 132, 42, 0.15);
                padding: 20px 64px 30px;
            }
            #stage {
                position: relative;
                width: calc(72ch);
                height: calc(37em + 72px);
                font-size: var(--font);
                line-height: 1em;
            }
            pre {
                position: absolute;
                left: 50%;
                bottom: 18px;
                margin: 0;
                white-space: pre;
                font: inherit;
                font-family: 'JetBrains Mono', monospace;
                font-weight: 700;
                transform-origin: 50% 100%;
                will-change: transform;
            }
            #body {
                text-shadow: 0 0 8px rgba(232, 132, 42, 0.2);
            }
            #eyes {
                text-shadow: 0 0 7px rgba(255, 248, 230, 0.55);
            }
            #shadow {
                position: absolute;
                left: 50%;
                bottom: 14px;
                width: calc(72ch * 0.6);
                height: 10px;
                background: radial-gradient(ellipse, rgba(232, 132, 42, 0.25), transparent 70%);
                transform: translateX(-50%);
                will-change: transform, opacity;
            }
            /* Chu ky goc duoi phai */
            .credit {
                position: absolute;
                right: 14px;
                bottom: 8px;
                font-size: 10px;
                color: rgba(232, 161, 60, 0.45);
                letter-spacing: 0.06em;
                user-select: none;
            }
            .credit a {
                color: rgba(232, 161, 60, 0.7);
                text-decoration: none;
                border-bottom: 1px dotted rgba(232, 161, 60, 0.4);
                transition: color 0.15s;
            }
            .credit a:hover {
                color: var(--accent);
            }
            .controls {
                display: none !important;
            }
            button:hover {
                background: rgba(232, 161, 60, 0.12);
            }
        </style>
    </head>
    <body>
        <div class="window">
            <div id="stage">
                <div id="shadow"></div>
                <pre id="body"></pre>
                <pre id="eyes"></pre>
            </div>
            <div class="credit">
                2026 by
                <a
                    href="https://github.com/kunkka19xx/look"
                    target="_blank"
                    rel="noopener noreferrer"
                    >Kunkka</a
                >
            </div>
        </div>
        <div class="controls">
            <label
                >Bieu cam
                <select id="pick">
                    <option value="auto">Tu dong</option>
                </select>
            </label>
            <label
                >Toc do <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"
            /></label>
            <label
                >Nay <input id="bounce" type="range" min="0" max="2" step="0.1" value="1"
            /></label>
            <button id="toggle">Tam dung</button>
        </div>

                        dy = items[i][1],
                        ch = items[i][2]
                    var x = eye.cx + (mirror ? -dx : dx),
                        y = eye.cy + dy
                    if (mirror) ch = mirrorCh(ch)
                    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) grid[y][x] = ch
                }
            }
            function eyeGridHTML(leftName, rightName) {
                var grid = []
                for (var y = 0; y < ROWS; y++) {
                    grid.push(new Array(COLS).fill(null))
                }
                placeEye(grid, EYE_L, EYES[leftName], false)
                placeEye(grid, EYE_R, EYES[rightName], true)
                return grid
                    .map(function (row) {
                        return row
                            .map(function (ch) {
                                if (ch === null) return ' '
                                var c =
                                    ch === '<'
                                        ? '&lt;'
                                        : ch === '>'
                                          ? '&gt;'
                                          : ch === '&'
                                            ? '&amp;'
                                            : ch
                                return '<span style="color:' + EYE_COLOR + '">' + c + '</span>'
                            })
                            .join('')
                    })
                    .join('\n')
            }
            function makeHTML(name) {
                if (name === 'wink') return eyeGridHTML('happy', 'normal')
                if (name === 'angry') return eyeGridHTML('squint', 'squint')
                if (name === 'sad') return eyeGridHTML('blink', 'blink')
                return eyeGridHTML(name, name)
            }
            var ALL_NAMES = Object.keys(EYES).concat(SPECIAL)
            var EYE_HTML = {}
            for (var i = 0; i < ALL_NAMES.length; i++)
                EYE_HTML[ALL_NAMES[i]] = makeHTML(ALL_NAMES[i])

            var pickEl = document.getElementById('pick')
            for (var i = 0; i < ALL_NAMES.length; i++) {
                var o = document.createElement('option')
                o.value = ALL_NAMES[i]
                o.textContent = ALL_NAMES[i]
                pickEl.appendChild(o)
            }

            var eyesEl = document.getElementById('eyes')
            var shadow = document.getElementById('shadow')
            var speedEl = document.getElementById('speed')
            var bounceEl = document.getElementById('bounce')
            var toggleEl = document.getElementById('toggle')

            var t = 0,
                running = true,
                last = performance.now()
            var curEye = 'normal',
                nextSwitch = 1.6
            function randIdle() {
                return IDLE[Math.floor(Math.random() * IDLE.length)]
            }

            document.getElementById('stage').style.cursor = 'pointer'
            document.getElementById('stage').onclick = function () {
                if (pickEl.value === 'auto') {
                    curEye = randIdle()
                    nextSwitch = 0.9 + Math.random()
                }
            }
            pickEl.onchange = function () {
                if (pickEl.value !== 'auto') curEye = pickEl.value
            }

            function frame(now) {
                var dt = (now - last) / 1000
                last = now
                if (running) {
                    t += dt * parseFloat(speedEl.value)
                    if (pickEl.value === 'auto') {
                        nextSwitch -= dt
                        if (nextSwitch <= 0) {
                            if (curEye === 'normal') {
                                curEye = Math.random() < 0.4 ? 'blink' : randIdle()
                                nextSwitch = curEye === 'blink' ? 0.15 : 0.8 + Math.random() * 0.9
                            } else {
                                curEye = 'normal'
                                nextSwitch = 1.0 + Math.random() * 1.7
                            }
                        }
                    }
                }
                eyesEl.innerHTML = EYE_HTML[curEye]

                var amp = parseFloat(bounceEl.value)
                var bounce = -Math.abs(Math.sin(t * 3.0)) * 38 * amp
                var phase = Math.abs(Math.sin(t * 3.0))
                var sx = 1 + (1 - phase) * 0.05 * amp,
                    sy = 1 - (1 - phase) * 0.07 * amp
                var tilt = Math.sin(t * 3.0 + 0.4) * 2.5 * amp
                var tf =
                    'translateX(-50%) translateY(' +
                    bounce +
                    'px) rotate(' +
                    tilt +
                    'deg) scale(' +
                    sx +
                    ',' +
                    sy +
                    ')'
                bodyEl.style.transform = tf
                eyesEl.style.transform = tf

                var lift = -bounce / 38
                shadow.style.transform = 'translateX(-50%) scale(' + (1 - lift * 0.45) + ')'
                shadow.style.opacity = String(0.8 - lift * 0.5)
                requestAnimationFrame(frame)
            }
            requestAnimationFrame(frame)
            toggleEl.onclick = function () {
                running = !running
                toggleEl.textContent = running ? 'Tam dung' : 'Tiep tuc'
            }
        </script>
    </body>
</html>
